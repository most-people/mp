[workspace]
resolver = "2"
members = ["crates/mp-core", "crates/mp-cli", "crates/peeroxide-repro"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/most-people/mp"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
cid = "0.11"
clap = { version = "4", features = ["derive"] }
directories = "6"
hex = "0.4"
peeroxide = "=1.7.3"
peeroxide-dht = "=1.7.3"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
